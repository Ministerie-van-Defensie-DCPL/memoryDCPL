<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e3b2a">
<title>Memory</title>
<style>
:root{
  --paper:#e8ebe4; --surface:#ffffff; --ink:#1d241c; --muted:#5b6558; --line:#d3d8cf;
  --field:#3a4a35; --field-2:#2e3b2a; --brass:#b08d3c; --tape:#1f231e; --tape-ink:#f1f0e8;
  --ok:#3f7a4a; --danger:#a3392f; --focus:#b08d3c;
  --font:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141813; --surface:#1d231c; --ink:#e7eae3; --muted:#9ba597; --line:#2f382d;
    --field:#4b5f45; --field-2:#3a4a35; --brass:#caa653; --tape:#0d0f0c; --tape-ink:#ecebe2;
    --ok:#6fae7a; --danger:#e07a6f;
  }
}
:root[data-theme="dark"]{
  --paper:#141813; --surface:#1d231c; --ink:#e7eae3; --muted:#9ba597; --line:#2f382d;
  --field:#4b5f45; --field-2:#3a4a35; --brass:#caa653; --tape:#0d0f0c; --tape-ink:#ecebe2;
  --ok:#6fae7a; --danger:#e07a6f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Header */
.top{background:var(--field-2);color:#eef0e8;border-bottom:4px solid var(--brass)}
.top-in{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:0}
.brand{display:flex;gap:14px;align-items:center;padding-bottom:16px}
.mark{width:40px;height:40px;flex:none;background:var(--brass);clip-path:polygon(50% 0,100% 30%,100% 100%,50% 70%,0 100%,0 30%)}
.brand h1{margin:0;font-size:1.6rem;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:#c7cdbf;font-size:.95rem}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;color:#c7cdbf;padding:10px 16px 12px;cursor:pointer;border-radius:8px 8px 0 0;font-weight:600}
.tabs button:hover{color:#fff}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}

.dirty{margin-top:16px;background:color-mix(in srgb,var(--brass) 18%,var(--surface));border:1px solid var(--brass);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dirty[hidden]{display:none}
main{padding-top:22px;padding-bottom:48px}

/* Controls */
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.controls label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.92rem}
select,input[type=text],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{width:min(320px,100%)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.95rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--field);border-color:var(--field);color:#fff}
.btn.primary:hover{background:var(--field-2)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.danger{color:var(--danger)}
.stats{display:flex;gap:18px;color:var(--muted);font-size:.92rem}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}

/* Memory grid */
.grid{display:grid;gap:var(--gap,12px);justify-content:center;grid-template-columns:repeat(var(--cols,4),var(--size,120px))}
.card{width:var(--size,120px);height:var(--size,120px);border:0;padding:0;background:none;cursor:pointer;perspective:900px;border-radius:12px;container-type:size;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.inner{position:relative;display:block;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{
  background:
    repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.035) 10px 20px),
    var(--field);
  display:grid;place-items:center;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)
}
.back::after{content:"";width:38%;aspect-ratio:1;background:var(--brass);opacity:.9;
  clip-path:polygon(0 0,50% 30%,100% 0,100% 30%,50% 60%,0 30%,0 60%,50% 90%,100% 60%,100% 72%,50% 100%,0 72%)}
@media (hover:hover){.card:hover .back{filter:brightness(1.08)}}
.front{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--line)}
.front img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.front img.contain,.person img.contain,.item img.contain{object-fit:contain;background:#fff;padding:10%}
.front.name{display:flex;flex-direction:column;justify-content:center;align-items:stretch;background:var(--surface)}
.front.name .tape{font-size:15px;font-size:clamp(9px,10.5cqw,16px);padding:6cqw 4cqw;letter-spacing:.04em;overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}
.front.name .role{font-size:12px;font-size:clamp(8px,8.5cqw,13px);padding:4cqw 5cqw 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tape{background:var(--tape);color:var(--tape-ink);padding:10px 8px;text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(.78rem,1.5vw,.95rem);line-height:1.2;border-top:2px solid var(--brass);border-bottom:2px solid var(--brass)}
.role{padding:8px 10px 0;text-align:center;color:var(--muted);font-size:.82rem;line-height:1.3}
.card.matched .front{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.card.matched{cursor:default}
.hint{color:var(--muted);font-size:.9rem;margin:12px 0 0;text-align:center}
.gamebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.gamebar .actions{display:flex;gap:8px}
.settings{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.settings[hidden]{display:none}
.settings label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.92rem}
.settings select{font-size:16px}
@media (max-width:600px), (max-height:500px){
  .wrap{padding:0 12px}
  .top-in{padding-top:12px}
  .brand{gap:10px;padding-bottom:10px}
  .mark{width:28px;height:28px}
  .brand h1{font-size:1.2rem}
  .brand p{font-size:.85rem}
  main{padding-top:12px}
  .gamebar .stats{gap:12px;font-size:.85rem}
  .gamebar .btn{padding:7px 11px;font-size:.88rem}
  .hint{font-size:.82rem}
}
.shake .inner{animation:shake .35s}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}

/* Win */
.overlay{position:fixed;inset:0;background:rgba(10,14,10,.55);display:grid;place-items:center;padding:20px;z-index:10}
.modal{background:var(--surface);border-radius:14px;max-width:420px;width:100%;padding:26px;border-top:5px solid var(--brass)}
.modal h2{margin:0 0 6px;font-size:1.35rem}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .best{color:var(--ink);font-weight:600}

/* Smoelenboek */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.person img{aspect-ratio:1;object-fit:cover;object-position:50% 30%;width:100%}
.person .tape{font-size:.82rem;padding:7px 6px}
.person .meta{padding:8px 10px 12px;font-size:.85rem;color:var(--muted);line-height:1.35}
.chip{display:inline-block;margin-top:6px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.75rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--muted)}

/* Beheer */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.panel h2{margin:0 0 12px;font-size:1.1rem}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel-head h2{margin:0}
.panel p{color:var(--muted);margin:0 0 12px;max-width:70ch}
.form-grid{display:grid;grid-template-columns:150px 1fr;gap:18px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.photo-pick{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;color:var(--muted);font-size:.9rem;text-align:center;max-width:150px}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick img[src=""]{display:none}
.photo-pick input{position:absolute;opacity:0;inset:0;cursor:pointer}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-content:start}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fields .row{grid-column:1/-1}
.bulk{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.bulk summary{cursor:pointer;font-weight:600}
.bulk p{margin-top:8px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.item img.contain{padding:4px}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
.item .t{min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{color:var(--muted);font-size:.85rem}
.tag-demo{color:var(--brass);font-size:.75rem;margin-left:6px;font-weight:600}
code{background:color-mix(in srgb,var(--line) 60%,transparent);padding:1px 5px;border-radius:4px;font-size:.88em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tape);color:var(--tape-ink);padding:10px 16px;border-radius:8px;z-index:20;font-size:.92rem}

/* Live */
.live{border-left:5px solid var(--brass)}
.steps{margin:0;padding-left:1.3em;display:grid;gap:16px}
.steps li{padding-left:4px}
.steps .row{margin-top:8px}
.qr-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:8px}
.qr-row canvas{width:160px;height:160px;border:1px solid var(--line);border-radius:8px;background:#fff}
.muted{color:var(--muted);font-size:.9rem;margin:0 0 8px}
a.btn{text-decoration:none}
a.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  .inner{transition:none}
  .shake .inner{animation:none}
}
</style>
</head>

<script>
(function(){
'use strict';

// Snapshot of the untouched file, used to write an updated copy with new data inside.
var TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

var data;
try { data = JSON.parse(document.getElementById('game-data').textContent); }
catch(e){ data = {title:'Memory', subtitle:'', items:[]}; }
data.items = migrate(data);

// Accepts files from the earlier smoelenboek version (people with name/role/team/photo).
function migrate(d){
  if(Array.isArray(d.items)) return d.items;
  if(Array.isArray(d.people)){
    var out = d.people.map(function(p){ return {id:p.id||uid(), name:p.name||'', desc:p.role||'', cat:p.team||'', img:p.photo||'', demo:p.demo}; });
    delete d.people; return out;
  }
  return [];
}

var PLAY = data.play === true; // spelversie: alleen het spel, geen overzicht of beheer
var app = document.getElementById('app');
var dirty = false;

function $(s, r){ return (r||document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function byId(id){ for(var i=0;i<data.items.length;i++) if(data.items[i].id===id) return data.items[i]; return null; }
function cats(){ var s={}; data.items.forEach(function(p){ if(p.cat) s[p.cat]=1; }); return Object.keys(s).sort(function(a,b){return a.localeCompare(b,'nl');}); }
function fmtTime(ms){ var s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }
function plural(n, one, many){ return n + ' ' + (n===1 ? one : many); }

var COLORS=['#3a4a35','#5b4a2f','#2f4a55','#4a3552','#55402f','#2f5546','#4d4d2a','#3b3f58'];
function imgSrc(p){
  if(p.img) return p.img;
  var parts = String(p.name||'?').trim().split(/\s+/);
  var ini = (parts[0]||'?').charAt(0) + (parts.length>1 ? parts[parts.length-1].charAt(0) : '');
  var h=0; String(p.id).split('').forEach(function(c){ h=(h*31+c.charCodeAt(0))>>>0; });
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='"+COLORS[h%COLORS.length]+"'/><text x='100' y='124' font-family='Arial,sans-serif' font-size='70' font-weight='700' fill='#f1f0e8' text-anchor='middle'>"+esc(ini.toUpperCase())+"</text></svg>";
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function imgTag(p, alt, eager){ return '<img src="'+esc(imgSrc(p))+'" alt="'+esc(alt||'')+'"'+(p.img && p.fit==='contain'?' class="contain"':'')+(eager?'':' loading="lazy"')+' draggable="false">'; }

// Kiest het aantal kolommen zo dat alle kaarten zo groot mogelijk op het scherm passen, ook op een telefoon.
function layout(){
  var g = document.getElementById('grid'); if(!g || !game.cards.length) return;
  var n = game.cards.length, small = window.innerWidth < 600 || window.innerHeight < 500, gap = small ? 8 : 12;
  var W = g.getBoundingClientRect().width;
  var top = g.getBoundingClientRect().top + window.scrollY;
  var H = window.innerHeight - top - (small ? 44 : 56);
  if(H < 150) H = 9999; // liggende telefoon of heel klein scherm: passend in de breedte, dan scrollen
  var best = {cols:2, size:0};
  for(var c=2;c<=12;c++){
    var r = Math.ceil(n/c);
    var sz = Math.min((W-gap*(c-1))/c, (H-gap*(r-1))/r, 190);
    if(sz > best.size + 0.5 || (sz >= 190 && best.size >= 190)) best = {cols:c, size:sz};
  }
  if(best.size < 64){
    var c2 = Math.max(2, Math.floor((W+gap)/(72+gap)));
    best = {cols:c2, size:Math.min(190,(W-gap*(c2-1))/c2)};
  }
  g.style.setProperty('--gap', gap+'px');
  g.style.setProperty('--cols', best.cols);
  g.style.setProperty('--size', Math.floor(best.size)+'px');
}
var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(layout, 120); });
window.addEventListener('load', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout, 300); });

/* ---------- Shell ---------- */
function renderShell(){
  app.innerHTML =
    '<header class="top"><div class="wrap top-in">' +
      '<div class="brand"><div class="mark" aria-hidden="true"></div><div><h1 id="t-title"></h1><p id="t-sub"></p></div></div>' +
      (PLAY ? '' : '<nav class="tabs" role="tablist" aria-label="Onderdelen">' +
        '<button role="tab" data-view="spel">Spelen</button>' +
        '<button role="tab" data-view="leren">Overzicht</button>' +
        '<button role="tab" data-view="beheer">Beheer</button>' +
      '</nav>') +
    '</div></header>' +
    (PLAY ? '' : '<div class="wrap"><div id="dirty" class="dirty" hidden><span>Je wijzigingen staan nog niet in het beheerbestand. Download het beheerbestand om ze te bewaren.</span><button class="btn primary small" id="dirty-dl">Download beheerbestand</button></div></div>') +
    '<main id="view" class="wrap"></main>';
  app.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ go(b.dataset.view); }; });
  if(!PLAY) $('#dirty-dl').onclick = downloadHtml;
  updateHeader();
}
function updateHeader(){
  $('#t-title').textContent = data.title || 'Memory';
  $('#t-sub').textContent = data.subtitle || '';
  document.title = data.title || 'Memory';
}
function setDirty(v){ if(PLAY) return; dirty=v; $('#dirty').hidden=!v; }
window.addEventListener('beforeunload', function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });

function go(v){
  stopTimer();
  if(PLAY) v = 'spel';
  app.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.view===v ? 'true':'false'); });
  if(v==='spel') newGame(); else if(v==='leren') renderLearn(); else renderAdmin();
}

/* ---------- Game ---------- */
// mode 'name': plaatje zoeken bij de juiste naam. mode 'same': klassiek, twee dezelfde plaatjes.
var game = {cards:[], open:[], found:0, moves:0, start:0, timer:null, lock:false, pairs:8, cat:'all', mode:'name'};
function pool(){ return data.items.filter(function(p){ return game.cat==='all' || p.cat===game.cat; }); }
function stopTimer(){ if(game.timer){ clearInterval(game.timer); game.timer=null; } }

function newGame(){
  stopTimer();
  var pl = pool();
  if(pl.length < 2 && game.cat!=='all'){ game.cat='all'; pl = pool(); }
  var n = Math.max(0, Math.min(game.pairs, pl.length));
  var cards = [];
  shuffle(pl).slice(0, n).forEach(function(p){
    cards.push({pid:p.id, kind:'img'});
    cards.push({pid:p.id, kind: game.mode==='same' ? 'img' : 'name'});
  });
  game.cards = shuffle(cards); game.open=[]; game.found=0; game.moves=0; game.start=0; game.lock=false;
  renderGame();
}

function renderGame(){
  var v = $('#view');
  if(data.items.length < 2){
    if(PLAY){ v.innerHTML = '<div class="empty"><p>Dit spel heeft nog geen kaarten.</p></div>'; return; }
    v.innerHTML = '<div class="empty"><p>Er staan nog te weinig kaarten in het spel.</p><button class="btn primary" id="to-admin">Kaarten toevoegen</button></div>';
    $('#to-admin').onclick=function(){ go('beheer'); };
    return;
  }
  var cs = cats(), avail = pool().length, n = game.cards.length/2;
  var opts=''; for(var i=2;i<=Math.min(avail,30);i++) opts += '<option value="'+i+'"'+(i===n?' selected':'')+'>'+i+'</option>';
  var catSel = cs.length ? '<label>Categorie <select id="g-cat"><option value="all">Alles</option>' +
    cs.map(function(t){ return '<option value="'+esc(t)+'"'+(game.cat===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('') + '</select></label>' : '';
  v.innerHTML =
    '<div class="gamebar"><div class="stats" aria-live="polite"><span>Zetten<b id="s-moves">0</b></span><span>Tijd<b id="s-time">0:00</b></span><span>Gevonden<b id="s-found">0/'+n+'</b></span></div>' +
      '<div class="actions"><button class="btn ghost" id="g-set" aria-expanded="'+(game.showSet?'true':'false')+'" aria-controls="g-settings">Instellingen</button><button class="btn" id="g-new">Nieuw spel</button></div></div>' +
    '<div class="settings" id="g-settings"'+(game.showSet?'':' hidden')+'>' +
      '<label>Spel <select id="g-mode"><option value="name"'+(game.mode==='name'?' selected':'')+'>Plaatje bij naam</option><option value="same"'+(game.mode==='same'?' selected':'')+'>Twee dezelfde plaatjes</option></select></label>' +
      catSel +
      '<label>Paren <select id="g-pairs">'+opts+'</select></label>' +
    '</div>' +
    '<div class="grid" id="grid">' + game.cards.map(function(c,i){
      var p = byId(c.pid);
      var front = c.kind==='img'
        ? '<span class="face front">'+imgTag(p, '', true)+'</span>'
        : '<span class="face front name"><span class="tape">'+esc(p.name)+'</span>'+(p.desc?'<span class="role">'+esc(p.desc)+'</span>':'')+'</span>';
      return '<button class="card" data-i="'+i+'" aria-label="Kaart '+(i+1)+', dicht"><span class="inner"><span class="face back"></span>'+front+'</span></button>';
    }).join('') + '</div>' +
    '<p class="hint">'+(game.mode==='same' ? 'Zoek de twee kaarten met hetzelfde plaatje. Bij een match zie je wat het is.' : 'Zoek bij elk plaatje de juiste naam.')+'</p>';

  $('#g-mode').onchange=function(e){ game.mode=e.target.value; newGame(); };
  if($('#g-cat')) $('#g-cat').onchange=function(e){ game.cat=e.target.value; newGame(); };
  $('#g-pairs').onchange=function(e){ game.pairs=+e.target.value; newGame(); };
  $('#g-new').onclick=newGame;
  $('#g-set').onclick=function(){ game.showSet=!game.showSet; $('#g-settings').hidden=!game.showSet; this.setAttribute('aria-expanded', game.showSet?'true':'false'); layout(); };
  layout(); requestAnimationFrame(layout);
  $('#grid').addEventListener('click', function(e){ var b=e.target.closest('.card'); if(b) flip(+b.dataset.i, b); });
}

function cardLabel(i){ var c=game.cards[i], p=byId(c.pid); return c.kind==='img' ? 'Plaatje' + (game.mode==='same' ? '' : ', zoek de naam') : p.name + (p.desc ? ', '+p.desc : ''); }

function flip(i, el){
  if(game.lock || el.classList.contains('open') || el.classList.contains('matched')) return;
  if(!game.start){
    game.start = Date.now();
    game.timer = setInterval(function(){ var t=$('#s-time'); if(t) t.textContent = fmtTime(Date.now()-game.start); }, 250);
  }
  el.classList.add('open'); el.setAttribute('aria-label', cardLabel(i));
  game.open.push({i:i, el:el});
  if(game.open.length < 2) return;

  game.moves++; $('#s-moves').textContent = game.moves;
  var a = game.open[0], b = game.open[1];
  game.open = [];
  if(game.cards[a.i].pid === game.cards[b.i].pid){
    [a,b].forEach(function(x){ x.el.classList.add('matched'); x.el.classList.remove('open'); x.el.setAttribute('aria-label', byId(game.cards[x.i].pid).name + ', gevonden'); });
    game.found++;
    var n = game.cards.length/2;
    $('#s-found').textContent = game.found+'/'+n;
    if(game.mode==='same') toast(byId(game.cards[a.i].pid).name);
    if(game.found === n) setTimeout(win, game.mode==='same' ? 700 : 0);
  } else {
    game.lock = true;
    setTimeout(function(){ a.el.classList.add('shake'); b.el.classList.add('shake'); }, 450);
    setTimeout(function(){
      [a,b].forEach(function(x){ x.el.classList.remove('open','shake'); x.el.setAttribute('aria-label','Kaart '+(x.i+1)+', dicht'); });
      game.lock = false;
    }, 1100);
  }
}

function win(){
  stopTimer();
  var ms = Date.now()-game.start, n = game.cards.length/2;
  var key = 'memory-best:'+(data.title||'')+':'+game.mode+':'+game.cat+':'+n;
  var prev = null; try{ prev = JSON.parse(store(key)); }catch(e){}
  var record = !prev || game.moves < prev.moves || (game.moves===prev.moves && ms < prev.ms);
  if(record) store(key, JSON.stringify({moves:game.moves, ms:ms}));
  var best = record ? (prev ? 'Nieuw persoonlijk record.' : '') : 'Jouw record: '+prev.moves+' zetten in '+fmtTime(prev.ms)+'.';
  var o = document.createElement('div'); o.className='overlay';
  o.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="w-h"><h2 id="w-h">Alle paren gevonden</h2>' +
    '<p>'+plural(n,'paar','paren')+' in '+game.moves+' zetten en '+fmtTime(ms)+'.</p>' + (best?'<p class="best">'+best+'</p>':'') +
    '<div class="row"><button class="btn primary" id="w-again">Nog een keer</button>'+(PLAY?'':'<button class="btn ghost" id="w-book">Bekijk overzicht</button>')+'</div></div>';
  document.body.appendChild(o);
  $('#w-again').focus();
  $('#w-again').onclick=function(){ o.remove(); newGame(); };
  if($('#w-book')) $('#w-book').onclick=function(){ o.remove(); go('leren'); };
}

/* ---------- Beheer ---------- */
var editing = null, pendingImg = '';

// Verkleint naar max 480px zonder bij te snijden. Logo's met transparantie blijven PNG.
function readImage(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth || 480, h = img.naturalHeight || 480;
        var k = Math.min(1, 480/Math.max(w,h));
        var c = document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var alpha = /png|gif|webp|svg/i.test(file.type);
        res(alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function(){ rej(new Error('Dit bestand is geen leesbare afbeelding.')); };
      img.src = r.result;
    };
    r.onerror = function(){ rej(new Error('Het bestand kon niet worden gelezen.')); };
    r.readAsDataURL(file);
  });
}

/* ---------- QR ---------- */
function validUrl(u){ return /^https?:\/\/[^\s]+\.[^\s]+/i.test(u||''); }
function qrCanvas(text, size){
  var q = qrcode(0, 'M'); q.addData(text); q.make();
  var n = q.getModuleCount(), quiet = 4, total = n + quiet*2;
  var c = document.createElement('canvas'); c.width = c.height = size;
  var ctx = c.getContext('2d'), cell = size/total;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = '#000000';
  for(var r=0;r<n;r++) for(var col=0;col<n;col++) if(q.isDark(r,col))
    ctx.fillRect(Math.floor((col+quiet)*cell), Math.floor((r+quiet)*cell), Math.ceil(cell), Math.ceil(cell));
  return c;
}
function drawQr(){
  var cv = $('#qr'); if(!cv) return;
  var ctx = cv.getContext('2d'), url = data.liveUrl || '', ok = validUrl(url);
  ctx.clearRect(0,0,cv.width,cv.height);
  $('#qr-dl').disabled = !ok;
  var open = $('#live-open'); if(ok){ open.href = url; open.removeAttribute('aria-disabled'); } else { open.removeAttribute('href'); open.setAttribute('aria-disabled','true'); }
  if(!ok){ $('#qr-msg').textContent = url ? 'Dit is nog geen volledig webadres. Begin met https://' : 'Vul eerst het webadres van de spelversie in.'; cv.style.opacity = .15; return; }
  cv.style.opacity = 1;
  ctx.drawImage(qrCanvas(url, 660), 0, 0, cv.width, cv.height);
  $('#qr-msg').textContent = 'Scan om te testen. Deze code verwijst naar ' + url;
}

function slug(){ return (data.title||'memory').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'memory'; }
function save(blob, name){
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}
function buildFile(play){
  var doc = new DOMParser().parseFromString(TEMPLATE, 'text/html');
  var out = play
    ? {title:data.title, subtitle:data.subtitle, play:true, items:data.items.map(function(p){ return {id:p.id, name:p.name, desc:p.desc, cat:p.cat, img:p.img, fit:p.fit}; })}
    : {title:data.title, subtitle:data.subtitle, liveUrl:data.liveUrl||'', items:data.items};
  doc.getElementById('game-data').textContent = JSON.stringify(out).replace(/</g,'\\u003c');
  if(play){ var q = doc.getElementById('qr-lib'); if(q) q.remove(); }
  return new Blob(['<!DOCTYPE html>\n' + doc.documentElement.outerHTML], {type:'text/html'});
}
function downloadHtml(){
  save(buildFile(false), slug()+'-beheer.html');
  setDirty(false);
  toast('Beheerbestand gedownload');
}
function downloadPlay(){
  if(data.items.some(function(p){ return p.demo; }) && !confirm('Er staan nog voorbeeldkaarten in het spel. Toch de spelversie downloaden?')) return;
  save(buildFile(true), 'index.html');
  toast('Spelversie gedownload');
}
